<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Parser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 1rem 0 0.5rem;
        }

        textarea {
            box-sizing: border-box;
            display: block;
            min-height: 180px;
            padding: 0.75rem;
            resize: vertical;
            width: 100%;
        }

        #status {
            min-height: 1.5rem;
        }

        .erro {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>JSON Parser</h1>

    <label for="entrada">Texto de entrada</label>
    <textarea id="entrada" placeholder="Cole aqui o texto..."></textarea>

    <label for="saida">Resultado</label>
    <textarea id="saida" readonly></textarea>

    <p id="status" role="status"></p>

    <script>
        const entrada = document.getElementById('entrada');
        const saida = document.getElementById('saida');
        const status = document.getElementById('status');

        function formatarJson(valor) {
            return typeof valor === 'string' ? valor : JSON.stringify(valor, null, 2);
        }

        entrada.addEventListener('input', () => {
            const texto = entrada.value.trim();

            saida.value = '';
            status.className = '';

            if (!texto) {
                status.textContent = '';
                return;
            }

            try {
                const primeiroResultado = JSON.parse(texto);

                if (typeof primeiroResultado !== 'string') {
                    saida.value = formatarJson(primeiroResultado);
                    status.textContent = 'JSON válido: foi necessário apenas identar.';
                    return;
                }

                try {
                    const segundoResultado = JSON.parse(primeiroResultado);
                    saida.value = formatarJson(segundoResultado);
                    status.textContent = 'Foram necessários dois parses.';
                } catch {
                    saida.value = primeiroResultado;
                    status.textContent = 'Foi necessário apenas um parse; o resultado é texto.';
                }
            } catch {
                status.className = 'erro';
                status.textContent = 'O texto não é um JSON válido.';
            }
        });
    </script>
</body>
</html>
